<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Family Tree</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK for shared cloud database -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body { touch-action: manipulation; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .canvas-viewport { touch-action: none; user-select: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-hidden flex flex-col h-screen">

  <!-- Mobile Top Bar -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow">🌳</div>
      <h1 class="font-bold text-slate-800 text-base md:text-lg">Family Tree</h1>
    </div>
    
    <!-- View Switcher & Action Buttons -->
    <div class="flex items-center gap-2">
      <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs font-semibold">
        <button id="btnViewFocus" class="px-2.5 py-1 rounded-md bg-white shadow-sm text-indigo-700">Mobile</button>
        <button id="btnViewCanvas" class="px-2.5 py-1 rounded-md text-slate-600">Canvas</button>
      </div>
      <button id="btnAddPerson" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold active:scale-95 transition-transform shadow flex items-center gap-1">
        <span>+ Add</span>
      </button>
    </div>
  </header>

  <!-- Cloud Status Bar -->
  <div id="cloudBanner" class="bg-amber-50 border-b border-amber-200 px-3 py-1 text-xs text-amber-800 flex items-center justify-between">
    <span id="cloudStatusText">⚡ Local Mode (Enter Firebase Config to sync across all devices)</span>
    <button id="btnConfigFirebase" class="underline font-semibold ml-2">Setup Cloud</button>
  </div>

  <!-- Main Display Area -->
  <main class="relative flex-1 w-full h-full overflow-hidden">
    
    <!-- VIEW 1: Mobile-First Focus Navigator (Ideal for phones) -->
    <div id="focusView" class="w-full h-full overflow-y-auto p-4 flex flex-col items-center max-w-lg mx-auto pb-24">
      <div class="w-full space-y-6">
        
        <!-- Parents Section -->
        <div>
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">Parents</h2>
          <div id="focusParents" class="flex justify-center gap-3 flex-wrap"></div>
        </div>

        <!-- Center Focus Person Card -->
        <div class="flex flex-col items-center">
          <div class="w-1 h-4 bg-slate-300"></div>
          <div id="focusCurrentCard" class="w-full bg-white rounded-2xl p-4 shadow-md border-2 border-indigo-500 relative"></div>
          <div class="w-1 h-4 bg-slate-300"></div>
        </div>

        <!-- Spouse Section -->
        <div id="focusSpouseContainer">
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">Spouse / Partner</h2>
          <div id="focusSpouse" class="flex justify-center gap-3"></div>
        </div>

        <!-- Children Section -->
        <div>
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">Children</h2>
          <div id="focusChildren" class="flex justify-center gap-3 flex-wrap"></div>
        </div>
      </div>
    </div>

    <!-- VIEW 2: Pan & Zoom Graph Canvas (Desktop / Tablet / Landscape) -->
    <div id="canvasView" class="hidden absolute inset-0 canvas-viewport bg-slate-50 cursor-grab active:cursor-grabbing">
      <svg id="svgEdges" class="absolute inset-0 w-full h-full pointer-events-none z-0"></svg>
      <div id="treeContainer" class="absolute origin-top-left z-10"></div>
      
      <!-- Canvas Control Floaters -->
      <div class="absolute bottom-6 right-4 flex flex-col gap-2 z-20">
        <button id="btnZoomIn" class="w-10 h-10 rounded-full bg-white shadow-md border border-slate-200 text-lg font-bold flex items-center justify-center active:bg-slate-100">+</button>
        <button id="btnZoomOut" class="w-10 h-10 rounded-full bg-white shadow-md border border-slate-200 text-lg font-bold flex items-center justify-center active:bg-slate-100">-</button>
        <button id="btnResetView" class="w-10 h-10 rounded-full bg-white shadow-md border border-slate-200 text-xs font-bold flex items-center justify-center active:bg-slate-100">Reset</button>
      </div>
    </div>
  </main>

  <!-- Bottom Drawer / Modal (Add & Edit Person) -->
  <div id="memberModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-base font-bold text-slate-800">Add Family Member</h3>
        <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      
      <form id="memberForm" class="space-y-3 text-sm">
        <input type="hidden" id="editPersonId">
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name *</label>
          <input type="text" id="inpName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Birth Year</label>
            <input type="number" id="inpBirthYear" placeholder="e.g. 1975" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Passed Year (optional)</label>
            <input type="number" id="inpDeathYear" placeholder="Living if blank" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Photo URL</label>
          <input type="url" id="inpPhoto" placeholder="https://example.com/photo.jpg" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Relation / Title</label>
          <input type="text" id="inpRelation" placeholder="e.g. Father, Daughter" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Parent 1</label>
          <select id="selParent1" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Parent 2</label>
          <select id="selParent2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Spouse / Partner</label>
          <select id="selSpouse" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></select>
        </div>

        <div class="flex gap-2 pt-3">
          <button type="button" id="btnDeletePerson" class="hidden px-3 py-2 text-red-600 border border-red-200 rounded-lg hover:bg-red-50 font-semibold">Delete</button>
          <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-semibold shadow hover:bg-indigo-700">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. DATA STATE & INITIAL SEED
    // -------------------------------------------------------------
    const currentYear = new Date().getFullYear();
    let familyData = [
      { id: '1', name: 'Robert Vance', birth: 1948, death: 2019, photo: '', relation: 'Grandfather', parents: [], spouse: '2' },
      { id: '2', name: 'Margaret Vance', birth: 1952, death: null, photo: '', relation: 'Grandmother', parents: [], spouse: '1' },
      { id: '3', name: 'David Vance', birth: 1974, death: null, photo: '', relation: 'Father', parents: ['1', '2'], spouse: '4' },
      { id: '4', name: 'Sarah Jenkins', birth: 1977, death: null, photo: '', relation: 'Mother', parents: [], spouse: '3' },
      { id: '5', name: 'Lucas Vance', birth: 2002, death: null, photo: '', relation: 'Son', parents: ['3', '4'], spouse: null },
      { id: '6', name: 'Chloe Vance', birth: 2006, death: null, photo: '', relation: 'Daughter', parents: ['3', '4'], spouse: null }
    ];

    let currentFocusId = '3'; // Default focus on David Vance
    let firebaseDb = null;

    // -------------------------------------------------------------
    // 2. CLOUD DATABASE (FIREBASE REALTIME DB) CONFIG
    // -------------------------------------------------------------
    function initFirebase(cfg) {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(cfg);
        }
        firebaseDb = firebase.database();
        const treeRef = firebaseDb.ref('familyTree');

        // Realtime listener: whenever ANY family member makes an edit, all devices update live!
        treeRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val && Array.isArray(val) && val.length > 0) {
            familyData = val;
            renderAll();
          } else {
            // Push initial data to cloud if empty
            treeRef.set(familyData);
          }
        });

        document.getElementById('cloudStatusText').innerText = "🟢 Connected to Cloud (Synced live for everyone)";
        document.getElementById('cloudBanner').className = "bg-emerald-50 border-b border-emerald-200 px-3 py-1 text-xs text-emerald-800 flex items-center justify-between";
      } catch (err) {
        console.error(err);
        alert("Failed to connect to Firebase. Check your configuration keys.");
      }
    }

    function syncDataToCloud() {
      if (firebaseDb) {
        firebaseDb.ref('familyTree').set(familyData);
      } else {
        localStorage.setItem('localFamilyTree', JSON.stringify(familyData));
      }
      renderAll();
    }

    // -------------------------------------------------------------
    // 3. RENDER HELPERS
    // -------------------------------------------------------------
    function getPersonAge(p) {
      if (!p.birth) return '';
      if (p.death) return `${p.birth}–${p.death} (${p.death - p.birth} yrs)`;
      return `Age ${currentYear - p.birth}`;
    }

    function createMemberCardHtml(person, isFocus = false) {
      const initials = person.name.split(' ').map(n => n[0]).slice(0, 2).join('');
      const avatarHtml = person.photo 
        ? `<img src="${person.photo}" class="w-12 h-12 rounded-full object-cover border border-slate-200">`
        : `<div class="w-12 h-12 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center text-sm border border-indigo-200">${initials}</div>`;

      return `
        <div class="flex items-center gap-3">
          ${avatarHtml}
          <div class="min-w-0 flex-1">
            <h4 class="font-bold text-slate-800 text-sm truncate">${person.name}</h4>
            <p class="text-xs text-indigo-600 font-medium">${person.relation || 'Family Member'}</p>
            <p class="text-[11px] text-slate-400">${getPersonAge(person)}</p>
          </div>
          <button onclick="openEditModal('${person.id}')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1 rounded">Edit</button>
        </div>
      `;
    }

    // Render Mobile Focus View
    function renderFocusView() {
      const person = familyData.find(p => p.id === currentFocusId) || familyData[0];
      if (!person) return;

      // Focus Person Card
      document.getElementById('focusCurrentCard').innerHTML = createMemberCardHtml(person, true);

      // Parents
      const parentsContainer = document.getElementById('focusParents');
      parentsContainer.innerHTML = '';
      const parents = familyData.filter(p => (person.parents || []).includes(p.id));
      if (parents.length > 0) {
        parents.forEach(parent => {
          const div = document.createElement('div');
          div.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm w-44 cursor-pointer active:scale-95 transition-transform";
          div.innerHTML = createMemberCardHtml(parent);
          div.onclick = (e) => { if (e.target.tagName !== 'BUTTON') { currentFocusId = parent.id; renderFocusView(); } };
          parentsContainer.appendChild(div);
        });
      } else {
        parentsContainer.innerHTML = `<span class="text-xs text-slate-400 italic">No parents linked</span>`;
      }

      // Spouse
      const spouseContainer = document.getElementById('focusSpouse');
      spouseContainer.innerHTML = '';
      const spouse = familyData.find(p => p.id === person.spouse);
      if (spouse) {
        const div = document.createElement('div');
        div.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm w-48 cursor-pointer active:scale-95 transition-transform";
        div.innerHTML = createMemberCardHtml(spouse);
        div.onclick = (e) => { if (e.target.tagName !== 'BUTTON') { currentFocusId = spouse.id; renderFocusView(); } };
        spouseContainer.appendChild(div);
      } else {
        spouseContainer.innerHTML = `<span class="text-xs text-slate-400 italic">No spouse linked</span>`;
      }

      // Children
      const childrenContainer = document.getElementById('focusChildren');
      childrenContainer.innerHTML = '';
      const children = familyData.filter(p => (p.parents || []).includes(person.id));
      if (children.length > 0) {
        children.forEach(child => {
          const div = document.createElement('div');
          div.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm w-44 cursor-pointer active:scale-95 transition-transform";
          div.innerHTML = createMemberCardHtml(child);
          div.onclick = (e) => { if (e.target.tagName !== 'BUTTON') { currentFocusId = child.id; renderFocusView(); } };
          childrenContainer.appendChild(child);
        });
      } else {
        childrenContainer.innerHTML = `<span class="text-xs text-slate-400 italic">No children linked</span>`;
      }
    }

    // Render Canvas Layout View
    function renderCanvasView() {
      const container = document.getElementById('treeContainer');
      container.innerHTML = '';

      // Simple grid positioning for Canvas
      familyData.forEach((p, idx) => {
        const row = p.parents.length === 0 ? 0 : 1;
        const div = document.createElement('div');
        div.className = "absolute bg-white rounded-xl shadow border border-slate-200 p-3 w-48 cursor-pointer";
        div.style.left = `${(idx % 3) * 220 + 40}px`;
        div.style.top = `${Math.floor(idx / 3) * 120 + 40}px`;
        div.innerHTML = createMemberCardHtml(p);
        div.onclick = (e) => {
          if (e.target.tagName !== 'BUTTON') {
            currentFocusId = p.id;
            switchView('focus');
          }
        };
        container.appendChild(div);
      });
    }

    function renderAll() {
      renderFocusView();
      renderCanvasView();
      populateDropdowns();
    }

    // -------------------------------------------------------------
    // 4. MODAL & MEMBER CREATION
    // -------------------------------------------------------------
    function populateDropdowns() {
      const p1 = document.getElementById('selParent1');
      const p2 = document.getElementById('selParent2');
      const sp = document.getElementById('selSpouse');

      const options = `<option value="">-- None --</option>` + familyData.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      p1.innerHTML = options;
      p2.innerHTML = options;
      sp.innerHTML = options;
    }

    window.openEditModal = function(id = null) {
      const modal = document.getElementById('memberModal');
      const form = document.getElementById('memberForm');
      form.reset();

      if (id) {
        const p = familyData.find(item => item.id === id);
        if (!p) return;
        document.getElementById('modalTitle').innerText = 'Edit Profile';
        document.getElementById('editPersonId').value = p.id;
        document.getElementById('inpName').value = p.name;
        document.getElementById('inpBirthYear').value = p.birth || '';
        document.getElementById('inpDeathYear').value = p.death || '';
        document.getElementById('inpPhoto').value = p.photo || '';
        document.getElementById('inpRelation').value = p.relation || '';
        document.getElementById('selParent1').value = (p.parents && p.parents[0]) || '';
        document.getElementById('selParent2').value = (p.parents && p.parents[1]) || '';
        document.getElementById('selSpouse').value = p.spouse || '';
        document.getElementById('btnDeletePerson').classList.remove('hidden');
      } else {
        document.getElementById('modalTitle').innerText = 'Add Family Member';
        document.getElementById('editPersonId').value = '';
        document.getElementById('btnDeletePerson').classList.add('hidden');
      }
      modal.classList.remove('hidden');
    };

    document.getElementById('memberForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('editPersonId').value;
      const parents = [];
      const p1 = document.getElementById('selParent1').value;
      const p2 = document.getElementById('selParent2').value;
      if (p1) parents.push(p1);
      if (p2 && p2 !== p1) parents.push(p2);

      const member = {
        id: id || Date.now().toString(),
        name: document.getElementById('inpName').value.trim(),
        birth: parseInt(document.getElementById('inpBirthYear').value) || null,
        death: parseInt(document.getElementById('inpDeathYear').value) || null,
        photo: document.getElementById('inpPhoto').value.trim(),
        relation: document.getElementById('inpRelation').value.trim(),
        parents: parents,
        spouse: document.getElementById('selSpouse').value || null
      };

      if (id) {
        const idx = familyData.findIndex(p => p.id === id);
        if (idx !== -1) familyData[idx] = member;
      } else {
        familyData.push(member);
        currentFocusId = member.id;
      }

      syncDataToCloud();
      document.getElementById('memberModal').classList.add('hidden');
    });

    document.getElementById('btnDeletePerson').addEventListener('click', () => {
      const id = document.getElementById('editPersonId').value;
      if (confirm("Are you sure you want to remove this person?")) {
        familyData = familyData.filter(p => p.id !== id);
        syncDataToCloud();
        document.getElementById('memberModal').classList.add('hidden');
      }
    });

    // -------------------------------------------------------------
    // 5. VIEW SWITCHING & LISTENERS
    // -------------------------------------------------------------
    function switchView(mode) {
      if (mode === 'focus') {
        document.getElementById('focusView').classList.remove('hidden');
        document.getElementById('canvasView').classList.add('hidden');
        document.getElementById('btnViewFocus').className = "px-2.5 py-1 rounded-md bg-white shadow-sm text-indigo-700 font-semibold";
        document.getElementById('btnViewCanvas').className = "px-2.5 py-1 rounded-md text-slate-600";
      } else {
        document.getElementById('focusView').classList.add('hidden');
        document.getElementById('canvasView').classList.remove('hidden');
        document.getElementById('btnViewCanvas').className = "px-2.5 py-1 rounded-md bg-white shadow-sm text-indigo-700 font-semibold";
        document.getElementById('btnViewFocus').className = "px-2.5 py-1 rounded-md text-slate-600";
      }
    }

    document.getElementById('btnViewFocus').onclick = () => switchView('focus');
    document.getElementById('btnViewCanvas').onclick = () => switchView('canvas');
    document.getElementById('btnAddPerson').onclick = () => openEditModal();
    document.getElementById('btnCloseModal').onclick = () => document.getElementById('memberModal').classList.add('hidden');

    document.getElementById('btnConfigFirebase').onclick = () => {
      const apiKey = prompt("Paste your Firebase apiKey:");
      const databaseURL = prompt("Paste your Firebase databaseURL (e.g., https://your-tree-default-rtdb.firebaseio.com):");
      const projectId = prompt("Paste your Firebase projectId:");
      if (apiKey && databaseURL && projectId) {
        initFirebase({ apiKey, databaseURL, projectId });
      }
    };

    // Load Local Cache on Start
    const saved = localStorage.getItem('localFamilyTree');
    if (saved) {
      try { familyData = JSON.parse(saved); } catch(e){}
    }

    renderAll();
  </script>
</body>
</html>
